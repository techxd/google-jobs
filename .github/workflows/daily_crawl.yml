name: Daily Google Jobs Crawl & Update

on:
  schedule:
    # 00:00 UTC = 08:00 AM UTC+8 (Taiwan Time)
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Crawler
        run: |
          python3 google_jobs.py --output index.html

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html google_job.html
          if git diff --staged --quiet; then
            echo "No changes in jobs."
          else
            git commit -m "chore: auto-update jobs ($(date +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
